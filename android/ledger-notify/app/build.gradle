plugins {
    id 'com.android.application'
}
// 근무표 변경 알림(FCM): Firebase 콘솔에서 받은 google-services.json(git에 안 올림)이 app/ 아래에 있을 때만.
// 없으면 알림 받기 없이 빌드됨 (앱 설정에 '받을 수 없어요'로 보임)
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

// 서명: keystore.properties(git에 안 올림)가 있으면 그 키로, 없으면 디버그 키로.
// 같은 키로 서명해야 새 버전을 지우지 않고 덮어 설치할 수 있음
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
// 시험용 빌드(qa): 정식 키가 없을 때 임시 키(keystore-test.properties, git에 안 올림)로 서명해 정식 앱과 따로 설치되는 시험 앱을 만듦.
// 패키지 이름이 kr.home.ledgernotify.test라 가계부 관리자 칸에는 올라가지 않음 (정식 릴리즈는 반드시 release + 원래 키로)
def testProps = new Properties()
def testFile = rootProject.file('keystore-test.properties')
if (testFile.exists()) testFile.withInputStream { testProps.load(it) }

android {
    namespace 'kr.home.ledgernotify'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.home.ledgernotify'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '1.14'
    }

    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
        if (testFile.exists()) {
            qa {
                storeFile file(testProps['storeFile'])
                storePassword testProps['storePassword']
                keyAlias testProps['keyAlias']
                keyPassword testProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        // 시험 앱: 이름 'YeYe홈 테스트'(src/qa/res), 정식 앱 옆에 따로 설치됨 (gradle assembleQa)
        qa {
            initWith release
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            matchingFallbacks = ['release']
            signingConfig testFile.exists() ? signingConfigs.qa : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
