version: '3'
# 수집기(크롬)와 대시보드 웹서버를 컨테이너 두 개로 나눠 실행: 수집이 무거워도(크롬·페이지 분석) 외부 접속 응답이 느려지지 않게.
# 둘은 같은 이미지·코드·output 폴더(DB: output/board.db, SQLite WAL이라 함께 써도 읽기가 막히지 않음)를 씀.
# CPU가 모자랄 때는 cpu_shares 비율대로 나눠 쓰므로 웹서버가 먼저 받음 (남을 때는 수집기도 제한 없이 씀)
services:
  fmkorea-scraper:
    build: .
    # 두 서비스가 같은 이미지를 쓰도록 이름을 정함 (deploy_remote.sh가 재빌드 여부를 볼 때도 이 이름)
    image: fmkorea-scraper:local
    container_name: fmkorea-scraper
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/output
      # 로그·화면 시각을 한국 시간으로 표시 (기본값은 UTC)
      - TZ=Asia/Seoul
      # docker logs에 출력할 레벨 (INFO: 새 글·삭제·오류·주기 요약만 출력)
      # DEBUG까지 포함한 전체 로그는 레벨과 상관없이 output/logs/debug.log에 항상 기록됨 (logs.bat -DebugLog)
      - LOG_LEVEL=INFO
      # 코드 폴더를 읽기 전용으로 연결하므로 __pycache__를 만들지 않음
      - PYTHONDONTWRITEBYTECODE=1
      # 웹서버는 아래 fmkorea-web 컨테이너가 맡음
      - RUN_WEB_SERVER=0
    cpu_shares: 256
    restart: unless-stopped
    volumes:
      # NAS의 공유 폴더에 DB·로그·이미지 저장 (경로는 NAS 환경에 맞게 수정)
      - /volume2/docker/fmkorea-scraper/output:/output
      # 코드(app/)는 이미지 대신 NAS의 프로젝트 폴더를 그대로 사용 → 코드만 바뀌면 재빌드 없이 재시작만
      # (이미지 재빌드는 Dockerfile·requirements.txt가 바뀔 때만 deploy/deploy.ps1이 수행)
      - .:/app:ro
    deploy:
      resources:
        limits:
          memory: 1G

  fmkorea-web:
    build: .
    image: fmkorea-scraper:local
    container_name: fmkorea-web
    # 수집기 컨테이너를 먼저 다룸 (기존 수집기 컨테이너가 쓰던 8082 포트를 먼저 내려놓게)
    depends_on:
      - fmkorea-scraper
    command: ["python", "-u", "app/web_server.py"]
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/output
      - TZ=Asia/Seoul
      - LOG_LEVEL=INFO
      - PYTHONDONTWRITEBYTECODE=1
      # 수집기와 같은 로그 파일을 함께 순환시키지 않도록 웹서버 전체 로그는 output/logs/web-debug.log
      - DEBUG_LOG_NAME=web-debug.log
    ports:
      - "8082:8081"
    cpu_shares: 1024
    restart: unless-stopped
    volumes:
      - /volume2/docker/fmkorea-scraper/output:/output
      - .:/app:ro
    deploy:
      resources:
        limits:
          memory: 384M
