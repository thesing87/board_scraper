<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키워드 모니터</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ccircle cx='14.5' cy='14.5' r='6.5' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19.5 19.5l5 5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-row">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                </span>
                <div class="brand-text">
                    <span class="brand-name">키워드 모니터</span>
                    <span class="status-pill" id="status-pill"><span class="status-dot"></span><span id="status-text">불러오는 중</span></span>
                </div>
            </div>
            <form class="search-form" id="search-form" role="search">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input type="search" id="search-input" class="search-input" placeholder="모은 글 검색 (제목·본문·댓글)" aria-label="모은 글 검색" maxlength="50" autocomplete="off">
            </form>
            <div class="topbar-actions">
                <button class="icon-btn ghost mobile-only" data-action="toggle-search" aria-label="검색">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                </button>
                <button class="icon-btn desktop-only" data-action="refresh" aria-label="새로고침">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v5h-5"></path></svg>
                </button>
                <button class="btn btn-outline" data-action="open-settings" aria-label="관리">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path><circle cx="9" cy="6" r="2" fill="#FFFFFF"></circle><circle cx="15" cy="12" r="2" fill="#FFFFFF"></circle><circle cx="7" cy="18" r="2" fill="#FFFFFF"></circle></svg>
                    <span class="desktop-only">관리</span>
                </button>
            </div>
        </div>
        <nav class="chip-row mobile-only" id="chip-row" aria-label="게시판"></nav>
    </header>

    <div class="layout">
        <aside class="sidebar desktop-only">
            <div class="sidebar-head">
                <span>게시판</span>
                <button class="icon-btn small" data-action="open-settings" aria-label="게시판 만들기">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                </button>
            </div>
            <div id="keyword-groups"></div>
            <div class="alert-summary">
                <span class="alert-summary-title">텔레그램 알림</span>
                <span class="alert-summary-text" id="alert-summary"></span>
                <button class="link-btn" data-action="open-settings">알림 설정 변경</button>
            </div>
        </aside>

        <main class="feed-wrap">
            <div class="new-banner-wrap">
                <button class="new-banner" id="new-banner" data-action="show-new" hidden></button>
            </div>
            <div class="feed" id="feed">
                <div class="empty-card">불러오는 중...</div>
            </div>
        </main>
    </div>

    <div class="floating">
        <button class="fab fab-top" id="floating-top-btn" data-action="scroll-top" aria-label="맨 위로">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg>
        </button>
        <button class="fab fab-refresh mobile-only" data-action="refresh" aria-label="새로고침">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v5h-5"></path></svg>
        </button>
    </div>

    <div class="settings-backdrop" id="settings" hidden>
        <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <header class="settings-head">
                <button class="icon-btn ghost" data-action="close-settings" aria-label="닫기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
                <h2 id="settings-title">관리</h2>
            </header>
            <div class="settings-body">
                <section class="settings-card">
                    <label for="admin-pwd-input" class="settings-label">관리자 암호</label>
                    <input id="admin-pwd-input" type="password" class="input" autocomplete="current-password">
                    <span class="settings-hint">게시판과 알림 설정을 바꿀 때 필요합니다.</span>
                </section>

                <section class="settings-card">
                    <span class="settings-label" id="group-form-title">게시판 만들기</span>
                    <span class="settings-hint">게시판에 키워드를 등록하면 그 키워드들의 글을 중복 없이 모아 보여줍니다.</span>
                    <input id="group-name-input" class="input" placeholder="게시판 이름 (예: 싼타페)" maxlength="30" aria-label="게시판 이름">
                    <div class="add-row">
                        <select id="group-board-select" class="input select" aria-label="카테고리"></select>
                        <input id="group-kw-input" class="input" aria-label="등록할 키워드" placeholder="키워드 입력" maxlength="50">
                        <button class="btn btn-outline" data-action="add-draft-keyword">추가</button>
                    </div>
                    <div class="keyword-tags" id="group-keywords" aria-label="등록한 키워드"></div>
                    <div class="group-form-actions">
                        <button class="btn btn-primary" data-action="save-group" id="group-save-btn">만들기</button>
                        <button class="btn btn-outline" data-action="cancel-group-edit" id="group-cancel-btn" hidden>취소</button>
                    </div>
                    <div class="group-list" id="settings-groups"></div>
                </section>

                <section class="settings-card">
                    <div class="alert-head">
                        <span class="settings-label">텔레그램 알림</span>
                        <span class="alert-cols"><span>전체</span><span>동영상</span></span>
                    </div>
                    <div id="settings-alerts"></div>
                </section>
            </div>
        </section>
    </div>
</body>
</html>
