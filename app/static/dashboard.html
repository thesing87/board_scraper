<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>대시보드</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Crect x='8' y='8' width='7' height='7' rx='1.5' fill='white'/%3E%3Crect x='17' y='8' width='7' height='7' rx='1.5' fill='white'/%3E%3Crect x='8' y='17' width='7' height='7' rx='1.5' fill='white'/%3E%3Crect x='17' y='17' width='7' height='7' rx='1.5' fill='white'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="stylesheet" href="/dashboard.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/games.js" defer></script>
    <script src="/dashboard.js" defer></script>
</head>
<body>
    <!-- 공통 상단 바: 키워드 게시판과 같은 구성 (제목 줄 + 바로가기 줄, 화면 위에 고정. nav.css·nav.js) -->
    <header class="site-top">
        <div class="site-top-row">
            <div class="site-top-brand">
                <span class="site-top-mark" style="background:#2563EB" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>
                <h1>대시보드</h1>
            </div>
            <div class="site-top-tools">
                <span class="dash-clock" id="dash-clock"></span>
                <button type="button" class="tool-btn" id="layout-reset" hidden>기본값</button>
                <button type="button" class="tool-btn" id="layout-edit" aria-pressed="false">편집</button>
            </div>
        </div>
        <nav class="site-nav" data-current="home"></nav>
    </header>
    <main class="dash">

        <div class="dash-grid" id="dash-grid">
            <!-- 키워드 게시판: 안 읽은 새 글·새 댓글·오늘 수집, 새 글 있는 게시판, 최근 수집 글, 수집 상태 (dashboard.js renderBoard) -->
            <section class="card" id="card-board" aria-labelledby="board-title">
                <a class="card-head" href="/board/">
                    <span class="card-icon is-board" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="board-title">키워드 게시판</span>
                        <span class="card-sub" id="board-sub">불러오는 중</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="board-body"><div class="skeleton"></div></div>
            </section>

            <!-- 전기차 vs 내연기관: 이 기기에 저장된 계산기 입력값으로 계산한 요약 (dashboard.js renderEv) -->
            <section class="card" id="card-ev" aria-labelledby="ev-title">
                <a class="card-head" href="/ev/">
                    <span class="card-icon is-ev" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="ev-title">전기차 vs 내연기관</span>
                        <span class="card-sub">유지비 비교 계산기</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="ev-body"></div>
            </section>

            <!-- 카드 혜택 한도: 이번 달 사용액과 남은 금액 (dashboard.js loadBenefit). 소비 내역이라 로그인한 기기에서만 표시 -->
            <section class="card" id="card-benefit" aria-labelledby="benefit-title">
                <a class="card-head" href="/card/">
                    <span class="card-icon is-benefit" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="benefit-title">카드 혜택 한도</span>
                        <span class="card-sub" id="benefit-sub">삼성카드</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="benefit-body"></div>
            </section>

            <!-- 아파트 실거래가: 관심 단지마다 최근 거래가·직전 대비·추이 한 줄, 누르면 그 단지 상세로 (dashboard.js loadApt) -->
            <section class="card" id="card-apt" aria-labelledby="apt-title">
                <a class="card-head" href="/apt/">
                    <span class="card-icon is-apt" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"></path><path d="M14 10h5a1 1 0 0 1 1 1v10"></path><path d="M2 21h20"></path><path d="M8 8h2M8 12h2M8 16h2"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="apt-title">아파트 실거래가</span>
                        <span class="card-sub" id="apt-sub">불러오는 중</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="apt-body"><div class="skeleton"></div></div>
            </section>

            <!-- 게시판별 인기글: 최근 24시간 동안 게시판마다 추천+댓글이 많은 글 3개 (dashboard.js loadPopular) -->
            <section class="card" id="card-popular" aria-labelledby="popular-title">
                <a class="card-head" href="/board/#popular">
                    <span class="card-icon is-popular" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4 0-7-2.7-7-6.5 0-3 2-5 3.5-6.5.3 1.6 1.2 2.7 2.5 3.2C11 8 12 5 14.5 3c.2 2.6 1.6 4.3 3 6 1 1.3 1.5 2.7 1.5 4.5 0 4.2-3 7.5-7 7.5z"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="popular-title">게시판별 인기글</span>
                        <span class="card-sub">최근 24시간 · 추천+댓글 순</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="popular-body"><div class="skeleton"></div></div>
            </section>

            <!-- 수집 통계: 최근 7일 동안 수집한 글 수 (dashboard.js loadStats) -->
            <section class="card" id="card-stats" aria-labelledby="stats-title">
                <a class="card-head" href="/stats/">
                    <span class="card-icon is-stats" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10"></path><path d="M12 20V4"></path><path d="M19 20v-7"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="stats-title">수집 통계</span>
                        <span class="card-sub" id="stats-sub">최근 7일</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="stats-body"><div class="skeleton"></div></div>
            </section>

            <!-- 게임: 스도쿠 진행 상태·기록 (이 기기에 저장된 값, dashboard.js renderGames) -->
            <section class="card" id="card-games" aria-labelledby="games-title">
                <a class="card-head" href="/games/">
                    <span class="card-icon is-games" aria-hidden="true">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"></rect><path d="M7 11v3M5.5 12.5h3M15.5 11.5h.01M17.5 13.8h.01"></path></svg>
                    </span>
                    <span class="card-name">
                        <span class="card-title" id="games-title">게임</span>
                        <span class="card-sub">스도쿠</span>
                    </span>
                    <span class="card-open">열기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
                </a>
                <div class="card-body" id="games-body"></div>
            </section>
        </div>
    </main>
</body>
</html>
