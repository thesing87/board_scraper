<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>스도쿠</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232B2B2B'/%3E%3Cpath d='M12 6v20M20 6v20M6 12h20M6 20h20' stroke='%23F5EFE3' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4EEE2">
    <link rel="stylesheet" href="/sudoku.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/sudoku-engine.js" defer></script>
    <script src="/sudoku.js" defer></script>
</head>
<body>
    <!-- 공통 상단 바: 키워드 게시판과 같은 구성 (제목 줄 + 바로가기 줄, 화면 위에 고정. nav.css·nav.js) -->
    <header class="site-top">
        <div class="site-top-row">
            <div class="site-top-brand">
                <a class="back-link" href="/games/" aria-label="게임 목록으로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
                <span class="site-top-mark" style="background:#2B2B2B" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"></path></svg></span>
                <h1>스도쿠</h1>
            </div>
        </div>
        <nav class="site-nav" data-current="games"></nav>
    </header>

    <main class="sd">
        <!-- 위: 난이도·실수·시간·일시정지·소리 -->
        <div class="sd-bar">
            <div class="diffs" role="group" aria-label="난이도 (누르면 새 게임)">
                <button type="button" class="diff-btn" data-diff="easy">쉬움</button>
                <button type="button" class="diff-btn" data-diff="medium">보통</button>
                <button type="button" class="diff-btn" data-diff="hard">어려움</button>
                <button type="button" class="diff-btn" data-diff="expert">전문가</button>
            </div>
            <div class="sd-status">
                <span class="stat"><span class="stat-label">실수</span><b id="mistakes">0/3</b></span>
                <span class="stat"><span class="stat-label">시간</span><b id="timer">00:00</b></span>
                <button type="button" class="icon-btn" id="pause-btn" aria-label="일시정지" aria-pressed="false" title="일시정지 (P)">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="pause-icon"></svg>
                </button>
                <button type="button" class="icon-btn" id="mute-btn" aria-label="소리 끄기" aria-pressed="false" title="소리">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="mute-icon"></svg>
                </button>
            </div>
        </div>

        <div class="sd-play">
            <!-- 보드: 종이 카드 위 9×9 (sudoku.js가 칸을 만듦) -->
            <div class="paper">
                <div class="board" id="board" role="grid" aria-label="스도쿠 보드"></div>
                <div class="paused" id="paused" hidden>
                    <p>일시정지</p>
                    <button type="button" id="resume-btn">계속하기</button>
                </div>
            </div>

            <div class="sd-side">
                <div class="tools">
                    <button type="button" class="tool" id="undo-btn" title="실행 취소 (Ctrl+Z)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
                        <span>실행 취소</span>
                    </button>
                    <button type="button" class="tool" id="erase-btn" title="지우기 (Backspace)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H9L4 15l9.5-9.5a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 19"></path><path d="M8 11l6 6"></path></svg>
                        <span>지우개</span>
                    </button>
                    <button type="button" class="tool" id="note-btn" aria-pressed="false" title="메모 모드 (N)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path><path d="M14 6l3 3"></path></svg>
                        <span>메모 <em id="note-state">꺼짐</em></span>
                    </button>
                    <button type="button" class="tool" id="lock-btn" aria-pressed="false" title="숫자 고정: 숫자를 고른 뒤 칸을 누를 때마다 채움 (숫자를 길게 눌러도 됨)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                        <span>고정 <em id="lock-state">꺼짐</em></span>
                    </button>
                    <button type="button" class="tool" id="hint-btn" title="힌트: 고른 칸 또는 바로 풀 수 있는 칸 하나 공개">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
                        <span>힌트</span>
                    </button>
                </div>
                <div class="pad" id="pad" aria-label="숫자 (길게 누르면 고정)">
                    <button type="button" class="pad-btn" data-d="1">1<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="2">2<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="3">3<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="4">4<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="5">5<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="6">6<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="7">7<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="8">8<span class="pad-left"></span></button>
                    <button type="button" class="pad-btn" data-d="9">9<span class="pad-left"></span></button>
                </div>
                <button type="button" class="new-btn" id="new-btn">새 게임</button>
                <p class="keys">방향키 이동 · 1–9 입력 · Backspace 지우기 · N 메모 · Ctrl+Z 취소 · P 일시정지 · 숫자를 길게 누르면 고정</p>
            </div>
        </div>
    </main>

    <!-- 결과·게임 오버 -->
    <div class="modal" id="modal" hidden>
        <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
    </div>
    <canvas class="confetti" id="confetti" hidden aria-hidden="true"></canvas>
</body>
</html>
