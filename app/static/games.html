<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>게임</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B45309'/%3E%3Crect x='6' y='11' width='20' height='12' rx='6' fill='white'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="stylesheet" href="/games.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/games.js" defer></script>
</head>
<body>
    <!-- 공통 상단 바: 키워드 게시판과 같은 구성 (제목 줄 + 바로가기 줄, 화면 위에 고정. nav.css·nav.js) -->
    <header class="site-top">
        <div class="site-top-row">
            <div class="site-top-brand">
                <span class="site-top-mark" style="background:#B45309" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r=".6" fill="currentColor"></circle><circle cx="17.5" cy="13.8" r=".6" fill="currentColor"></circle></svg></span>
                <h1>게임</h1>
            </div>
        </div>
        <nav class="site-nav" data-current="games"></nav>
    </header>

    <main class="games">
        <!-- 게임 목록. 진행 상태·기록은 이 기기에 저장된 값 (games.js) -->
        <a class="game" href="/games/sudoku/" id="game-sudoku">
            <span class="game-art" aria-hidden="true">
                <svg viewBox="0 0 90 90"><rect x="1" y="1" width="88" height="88" rx="8" fill="#FBF8F1" stroke="#2B2B2B" stroke-width="2"/>
                    <path d="M31 1v88M60 1v88M1 31h88M1 60h88" stroke="#2B2B2B" stroke-width="1.6"/>
                    <path d="M11 1v88M21 1v88M41 1v88M50 1v88M70 1v88M80 1v88M1 11h88M1 21h88M1 41h88M1 50h88M1 70h88M1 80h88" stroke="#D9D0BE" stroke-width=".8"/>
                    <g font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#2B2B2B" font-weight="700"><text x="6" y="9">5</text><text x="26" y="19">3</text><text x="46" y="39">7</text><text x="65" y="49">1</text><text x="85" y="69">9</text><text x="16" y="78">8</text><text x="55" y="88">2</text></g>
                    <g font-family="Georgia, serif" font-size="8" font-style="italic" text-anchor="middle" fill="#1F4E9C"><text x="36" y="19">6</text><text x="75" y="29">4</text><text x="16" y="49">2</text><text x="55" y="68">5</text></g></svg>
            </span>
            <span class="game-info">
                <span class="game-title">스도쿠</span>
                <span class="game-desc">9×9 숫자 퍼즐 · 쉬움부터 전문가까지</span>
                <span class="game-status" id="sudoku-status">새 게임을 시작해 보세요</span>
                <span class="game-records" id="sudoku-records"></span>
            </span>
            <span class="game-play" id="sudoku-play">시작</span>
        </a>
    </main>
</body>
</html>
