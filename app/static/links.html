<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>에펨코리아 바로가기</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23993C1D'/%3E%3Cpath d='M18 8h6v6M14 18L24 8M24 18v5a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="stylesheet" href="/links.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/links.js" defer></script>
</head>
<body>
    <!-- 공통 상단 바: 키워드 게시판과 같은 구성 (제목 줄 + 바로가기 줄, 화면 위에 고정. nav.css·nav.js) -->
    <header class="site-top">
        <div class="site-top-row">
            <div class="site-top-brand">
                <span class="site-top-mark" style="background:#993C1D" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M10 14L20 4"></path><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"></path></svg></span>
                <h1>에펨코리아 바로가기</h1>
            </div>
        </div>
        <nav class="site-nav" data-current="links"></nav>
    </header>
    <main class="links">
        <!-- 게시판마다 등록한 에펨코리아 검색 링크 (links.js). 누르면 새 창에서 에펨코리아 검색 결과, 서버는 에펨코리아에 요청하지 않음 -->
        <div class="links-tools">
            <input type="search" id="links-filter" class="links-filter" placeholder="키워드·게시판 이름으로 거르기" aria-label="키워드·게시판 이름으로 거르기" autocomplete="off">
            <span class="links-count" id="links-count" role="status"></span>
        </div>
        <div id="links-body"><div class="skeleton"></div></div>
        <p class="foot-note">에펨코리아는 이용약관에 따라 자동으로 수집하지 않고, 등록한 키워드의 검색 결과로 가는 링크만 모아 둡니다. 링크는 키워드 게시판의 '게시판 편집'에서 추가하고 뺄 수 있습니다.</p>
    </main>
</body>
</html>
