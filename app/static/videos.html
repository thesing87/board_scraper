<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>동영상</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C3AED'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="stylesheet" href="/videos.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/videos.js" defer></script>
</head>
<body>
    <!-- 관리자 전용 페이지: 바로가기 메뉴에서는 관리자 기기에만 보이고, 공유 버튼은 두지 않음 (data-no-share) -->
    <header class="site-top" data-no-share>
        <div class="site-top-row">
            <div class="site-top-brand">
                <span class="site-top-mark" style="background:#7C3AED" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"></path></svg></span>
                <h1>동영상</h1>
            </div>
        </div>
        <nav class="site-nav" data-current="videos"></nav>
    </header>

    <main class="library" id="library">
        <form class="login" id="login" hidden>
            <h2>로그인이 필요합니다</h2>
            <p>동영상은 관리자 암호로 로그인한 기기에서만 볼 수 있습니다.</p>
            <input type="password" id="login-password" autocomplete="current-password" placeholder="관리자 암호" aria-label="관리자 암호">
            <button type="submit">로그인</button>
            <p class="login-error" id="login-error" role="alert"></p>
        </form>
        <div class="notice" id="notice" hidden></div>
        <div id="content" hidden>
            <!-- 동영상 폴더 전체에서 이름·폴더 검색 (videos.js runSearch) -->
            <form class="vsearch" id="vsearch" role="search" autocomplete="off">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input type="search" id="vsearch-input" placeholder="영상 이름·폴더 검색" aria-label="영상 검색" enterkeyhint="search">
                <button type="button" id="vsearch-clear" aria-label="검색어 지우기" hidden>×</button>
            </form>
            <section class="search-results" id="search-results" hidden>
                <h2 id="search-count"></h2>
                <div class="videos" id="search-list"></div>
            </section>
            <div id="library-view">
            <div class="crumbs-row">
                <nav class="crumbs" id="crumbs" aria-label="폴더 위치"></nav>
                <!-- 이 폴더(하위 폴더 포함, 맨 위면 전체)를 랜덤으로 재생: 누를 때마다 새로 섞음 (videos.js startRandom) -->
                <button type="button" class="random-btn" id="random-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg><span id="random-text">전체 랜덤 재생</span></button>
            </div>
            <!-- 이 폴더에 브라우저가 못 여는 영상이 있으면: 자동 변환 순서에 바로 넣기 (videos.js renderConvertBar) -->
            <div class="conv-bar" id="conv-bar" hidden>
                <span id="conv-bar-text"></span>
                <button type="button" id="conv-folder">모두 자동 변환</button>
            </div>
            <section class="recent" id="recent" hidden>
                <h2>이어 보기</h2>
                <div class="recent-list" id="recent-list"></div>
            </section>
            <!-- 최근에 들어온 영상 (맨 위 폴더에서만, videos.js loadLatest) -->
            <section class="recent" id="latest" hidden>
                <h2>최근 추가</h2>
                <div class="recent-list" id="latest-list"></div>
            </section>
            <div class="folders" id="folders"></div>
            <div class="videos" id="videos"></div>
            <p class="empty" id="empty" hidden>이 폴더에는 동영상이 없습니다.</p>
            </div>
        </div>
    </main>

    <!-- 재생 화면 (videos.js) -->
    <div class="player" id="player" hidden>
        <div class="player-top">
            <button type="button" class="p-btn" id="player-close" aria-label="목록으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
            <div class="player-title" id="player-title"></div>
            <!-- 랜덤 재생 중: 몇 번째인지, 누르면 랜덤 끔·다시 켬 (videos.js renderRandom) -->
            <button type="button" class="random-chip" id="random-chip" aria-pressed="true" title="랜덤 재생 끄기" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg><span id="random-chip-text"></span></button>
            <!-- ← → 한 번에 건너뛰는 시간: 이 기기에 저장 (videos.js setSeekStep) -->
            <div class="seek-wrap">
                <button type="button" class="seek-btn" id="seek-btn" aria-haspopup="true" aria-expanded="false" title="← → 건너뛰기 시간"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l-4 4 4 4M17 8l4 4-4 4M3 12h18"></path></svg><span id="seek-text">10초</span></button>
                <div class="seek-menu" id="seek-menu" role="menu" hidden>
                    <div class="seek-menu-head">← → 한 번에 건너뛰기</div>
                    <div id="seek-options"></div>
                    <div class="seek-menu-foot">이 기기에 저장돼요</div>
                </div>
            </div>
            <!-- 재생 정보: 끊길 때 원인(네트워크인지 기기 성능인지)을 보려고 (videos.js renderStats) -->
            <button type="button" class="p-btn" id="stats-btn" aria-label="재생 정보" aria-pressed="false" title="재생 정보"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg></button>
            <a class="p-btn" id="player-download" aria-label="내려받기" title="내려받기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></a>
            <!-- 전체화면: 영상만이 아니라 재생 화면 전체를 키움 → 전체화면에서도 이전·다음 버튼이 보임 (videos.js toggleFullscreen) -->
            <button type="button" class="p-btn" id="fs-btn" aria-label="전체화면" title="전체화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="fs-on" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path><path class="fs-off" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg></button>
        </div>
        <div class="player-stage">
            <video id="video" controls controlslist="nofullscreen" playsinline preload="metadata"></video>
            <div class="player-msg" id="player-msg" hidden></div>
            <!-- ← → 를 누르면 가운데에 잠깐 '+10초' (videos.js seekBy) -->
            <div class="seek-osd" id="seek-osd" aria-hidden="true"></div>
            <!-- 랜덤 재생 중: 지금 영상이 있는 폴더 -->
            <div class="random-from" id="random-from" hidden></div>
            <!-- 같은 폴더의 이전·다음 영상: 영상 위 양옆, 누르거나 마우스를 움직이면 떴다가 3초 뒤 사라짐 (videos.js updateNavButtons·showUi, 단축키 Shift+← / Shift+→) -->
            <div class="p-side is-prev">
                <button type="button" class="p-side-btn" id="prev-btn" aria-label="이전 영상" title="이전 영상" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14"></path><path d="M18 6l-9 6 9 6z" fill="currentColor"></path></svg></button>
                <span class="p-side-name" id="prev-name"></span>
            </div>
            <div class="p-side is-next">
                <button type="button" class="p-side-btn" id="next-nav-btn" aria-label="다음 영상" title="다음 영상" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14"></path><path d="M6 6l9 6-9 6z" fill="currentColor"></path></svg></button>
                <span class="p-side-name" id="next-name"></span>
            </div>
            <div class="stats" id="stats" hidden aria-live="off">
                <div class="stats-verdict" id="stats-verdict"></div>
                <dl>
                    <div><dt>미리 받아 둔 시간</dt><dd id="st-buffer">–</dd></div>
                    <div><dt>받는 속도</dt><dd id="st-speed">–</dd></div>
                    <div><dt>영상에 필요한 속도</dt><dd id="st-bitrate">–</dd></div>
                    <div><dt>멈춰서 기다림</dt><dd id="st-waits">0번</dd></div>
                    <div><dt>건너뛴 프레임</dt><dd id="st-dropped">–</dd></div>
                    <div><dt>해상도</dt><dd id="st-size">–</dd></div>
                </dl>
            </div>
        </div>
        <div class="resume" id="resume" hidden>
            <span id="resume-text"></span>
            <button type="button" id="resume-start">처음부터</button>
        </div>
        <div class="player-next" id="player-next" hidden>
            <button type="button" id="next-btn"></button>
        </div>
    </div>
</body>
</html>
