<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>YeYe홈</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="stylesheet" href="/yeye.css">
    <link rel="stylesheet" href="/tabbar.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/yeye.js" defer></script>
</head>
<body class="has-tabbar">
    <!-- YeYe홈 앱의 홈 탭: 오늘 근무 · 이번 달 지출 · 확인할 결제 · 최근 내역 카드 (순서는 이 기기에서 바꿈, 가계부 로그인). 카드를 누르면 그 탭으로.
         아래 메뉴 '설정'(#settings): 앱 파일(관리자 올리기·앱 받기) · 이 휴대폰 앱(버전·새 버전 확인) · 로그아웃 -->
    <!-- 브라우저(PC 등)에서 열면 다른 페이지처럼 제목 줄과 사이트 메뉴. YeYe홈 앱 안에서는 숨김 (앱의 위쪽 탭) -->
    <header class="site-top" data-no-share>
        <div class="site-top-row">
            <div class="site-top-brand">
                <span class="site-top-mark" style="background:#0F6E56" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>
                <h1>YeYe홈</h1>
            </div>
        </div>
        <nav class="site-nav" data-current="yeye"></nav>
    </header>
    <main class="page">
        <section class="card auth" id="auth" hidden>
            <form id="login-form" autocomplete="on">
                <b>가계부 계정으로 로그인</b>
                <input id="login-name" name="username" autocomplete="username" placeholder="이름" maxlength="20">
                <input id="login-pw" type="password" autocomplete="current-password" placeholder="비밀번호">
                <button type="submit" class="primary">로그인</button>
                <p class="hint">처음이면 <a href="/ledger/">가계부</a>에서 가입을 요청해 주세요.</p>
            </form>
            <p class="msg" id="auth-msg" role="alert"></p>
        </section>

        <div id="app" hidden>
            <div class="greet"><span id="greet-date"></span><b id="greet-name"></b></div>
            <!-- 순서 바꾸는 중: 카드마다 ⋮⋮, 끌어서 옮기고 '완료' (이 기기에 저장) -->
            <div class="order-bar" id="order-bar" hidden><b>카드 순서</b><button type="button" class="link-btn" id="order-done">완료</button></div>
            <div id="cards">
                <div class="card go" id="duty-card" data-card="duty" data-go="/duty/" role="link" tabindex="0">
                    <div class="head"><b id="duty-title">오늘 근무</b><span class="drag" aria-hidden="true">⋮⋮</span></div>
                    <div id="duty-body"></div>
                </div>
                <div class="card go" id="ledger-card" data-card="spend" data-go="/ledger/" role="link" tabindex="0">
                    <div class="head"><b id="ledger-title">이번 달 지출</b><span class="drag" aria-hidden="true">⋮⋮</span></div>
                    <div id="ledger-body"></div>
                </div>
                <div class="card go inbox-card" id="inbox-card" data-card="inbox" data-go="/ledger/#inbox" role="link" tabindex="0">
                    <div class="head"><b>확인할 결제 <span id="inbox-n"></span></b><span class="more">보기 ›</span><span class="drag" aria-hidden="true">⋮⋮</span></div>
                </div>
                <div class="card go" id="recent-card" data-card="recent" data-go="/ledger/" role="link" tabindex="0">
                    <div class="head"><b>최근 내역</b><span class="drag" aria-hidden="true">⋮⋮</span></div>
                    <div id="recent-body"></div>
                </div>
            </div>
            <button type="button" class="link-btn order-btn" id="order-btn">⇅ 카드 순서 바꾸기</button>
            <p class="msg" id="msg" role="alert"></p>
        </div>

        <div id="set-view" hidden>
            <div class="set-top"><button type="button" class="small" id="set-back">‹ 홈</button><b>설정</b></div>
            <section class="card" id="appfile-card">
                <div class="head"><b>앱 파일</b><span class="tag" id="appfile-tag">관리자</span></div>
                <p class="hint" id="app-state"></p>
                <a class="app-get" id="app-get" href="/api/ledger/app.apk" hidden>YeYe홈 앱 받기</a>
                <div class="app-up" id="app-up" hidden>
                    <input type="file" id="app-file" accept=".apk,application/vnd.android.package-archive" aria-label="APK 파일">
                    <button type="button" class="small primary" id="app-upload" disabled>올리기</button>
                    <p class="hint">빌드한 YeYe홈 APK를 올리면 모두의 앱이 열 때 저절로 새 버전으로 바뀌어요.</p>
                </div>
                <p class="msg" id="app-msg" role="alert"></p>
            </section>
            <!-- 앱 안에서만: 이 휴대폰 앱(버전·새 버전) · 결제 알림(권한·금액 인식 알림·무시할 알림·최근 알림, 상태는 앱이 알려 줌) -->
            <section class="card in-app-only" id="phone-card">
                <div class="head"><b>이 휴대폰 앱</b></div>
                <div class="srow"><span class="n" id="phone-state"></span><button type="button" class="small" id="update-check">새 버전 확인</button></div>
            </section>
            <section class="card in-app-only" id="notify-card" hidden>
                <div class="head"><b>결제 알림 (이 휴대폰)</b></div>
                <button type="button" class="srow" data-phone id="ph-access"><span class="n">알림 읽기 권한<small id="ph-access-s"></small></span><span class="chev">›</span></button>
                <label class="srow"><span class="n">금액 인식 알림<small>결제를 받으면 휴대폰에 알려 줘요</small></span><input type="checkbox" class="tgl" id="ph-alert"></label>
                <button type="button" class="srow" data-phone id="ph-ignore"><span class="n">무시할 알림</span><span class="v" id="ph-ignore-n"></span><span class="chev">›</span></button>
                <button type="button" class="srow" data-phone id="ph-logs"><span class="n">결제 알림을 보낸 앱 · 최근 알림</span><span class="chev">›</span></button>
            </section>
            <section class="card in-app-only" id="duty-push-card" hidden>
                <div class="head"><b>근무표 변경 알림 (이 휴대폰)</b></div>
                <label class="srow"><span class="n">근무표 변경 알림<small id="ph-duty-s">다른 사람이 근무표를 고치면 바로 알려 줘요</small></span><input type="checkbox" class="tgl" id="ph-duty"></label>
            </section>
            <section class="card">
                <div class="head"><b>로그인</b></div>
                <p class="hint" id="who"></p>
                <button type="button" class="small" id="logout">로그아웃</button>
            </section>
        </div>
    </main>
    <!-- 아래 메뉴: 홈 · 설정 (tabbar.css, 가계부·근무표와 같은 모양). 로그인 전엔 숨김 -->
    <nav class="tabbar" hidden id="hnav" aria-label="아래 메뉴"><div class="tabbar-in"><button type="button" data-hv="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></button><button type="button" data-hv="set"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>설정</span></button></div></nav>
</body>
</html>
