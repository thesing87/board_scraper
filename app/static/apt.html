<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>아파트 실거래가</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F9D7A'/%3E%3Cpath d='M10 24V10h8v14M18 15h4v9M13 13h2M13 17h2M13 21h2' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="stylesheet" href="/apt.css">
    <link rel="stylesheet" href="/nav.css">
    <script src="/nav.js" defer></script>
    <script src="/apt-regions.js" defer></script>
    <script src="/apt.js" defer></script>
</head>
<body>
    <main class="apt">
        <header class="apt-top">
            <a class="back-link" href="/" id="back-link" aria-label="대시보드로">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
            <h1 id="page-title">아파트 실거래가</h1>
            <nav class="site-nav" data-current="apt"></nav>
            <button type="button" class="tool-btn" id="manage-btn" aria-pressed="false">관리</button>
        </header>
        <p class="status" id="status" role="status"></p>

        <!-- 목록: 관심 단지마다 최근 거래·직전 대비·추이 한 줄. 누르면 상세 (apt.js renderList) -->
        <section class="panel" id="list-view" aria-label="관심 단지"><div class="skeleton"></div></section>

        <!-- 상세: 단지 하나의 최근 거래가·추이 그래프·전체 거래 목록 (apt.js renderDetail) -->
        <section id="detail-view" hidden></section>

        <!-- 관리: 단지 찾기·등록·삭제·알림 (관리자 로그인 필요) -->
        <section class="panel" id="manage-view" hidden>
            <div id="login-box" hidden>
                <h2>관리자 로그인</h2>
                <form class="row-form" id="login-form">
                    <input type="password" id="login-pwd" autocomplete="current-password" placeholder="관리자 암호" aria-label="관리자 암호">
                    <button type="submit" class="btn-primary">로그인</button>
                </form>
                <p class="form-msg" id="login-msg" role="alert"></p>
            </div>
            <div id="manage-box" hidden>
                <h2>단지 찾아서 등록</h2>
                <!-- 1) 지역: 시·군·구 이름을 입력해 목록에서 고름 (코드 5자리를 넣어도 됨) -->
                <label class="field-label" for="region-input">지역 (시·군·구)</label>
                <div class="combo">
                    <input type="text" id="region-input" autocomplete="off" maxlength="30" placeholder="예: 강남구, 분당, 수원 영통"
                        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="region-list">
                    <div class="combo-list" id="region-list" role="listbox" hidden></div>
                </div>
                <!-- 2) 단지: 그 지역에서 최근 3년 거래된 단지를 목록으로 고르거나, 이름으로 거름 -->
                <div id="complex-box" hidden>
                    <label class="field-label" for="complex-select">단지</label>
                    <div class="row-form">
                        <input type="text" id="complex-filter" maxlength="40" placeholder="이름으로 거르기" aria-label="단지 이름으로 거르기">
                        <select id="complex-select" aria-label="단지 고르기"></select>
                    </div>
                </div>
                <p class="form-msg" id="search-msg" role="alert"></p>
                <div id="search-results"></div>
                <h2>등록한 단지</h2>
                <div id="watch-manage"></div>
            </div>
        </section>
        <p class="foot-note">국토교통부 실거래가 공개 자료입니다. 계약 후 신고까지 최대 30일이 걸려 최근 계약은 늦게 올라올 수 있고, 금액은 만원 단위에서 정리했습니다.</p>
    </main>
    <div class="tip" id="tip" role="status" hidden></div>
</body>
</html>
